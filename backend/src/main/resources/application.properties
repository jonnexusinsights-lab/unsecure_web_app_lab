# ==============================================================================
# InsecurePay Backend - Configuracion de la Billetera Digital
# NOTA PEDAGOGICA: Contiene configuraciones intencionalmente vulnerables
# ==============================================================================

server.port=8080

# Configuracion de Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:insecure_pay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web H2 (Acceso abierto a datos de la entidad financiera)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate & JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# [VULNERABILIDAD INTENCIONADA: A05:2021 - Security Misconfiguration]
# Fuga de Stack Traces y detalles internos de base de datos ante errores no controlados
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

# [VULNERABILIDAD INTENCIONADA: A02:2021 - Cryptographic Failures]
# Clave secreta simetrica debil y predecible quemada en archivo de texto plano
jwt.secret=ClaveSecretaSuperDebilInsecurePayBanco2026
jwt.expiration-ms=86400000

